<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelter Intercom - Receiver</title>
    <!-- Include Socket.IO client library directly from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            margin-top: 80px; 
            background-color: #121212; 
            color: #ffffff;
        }
        h1 { font-size: 3em; margin-bottom: 10px; }
        p { color: #aaaaaa; }
        
        button { 
            font-size: 24px; 
            padding: 20px 40px; 
            border-radius: 50px; 
            cursor: pointer; 
            border: none; 
            font-weight: bold; 
            transition: all 0.2s ease;
            margin-top: 30px;
        }
        button:active { transform: scale(0.95); }
        
        #listenBtn { 
            background-color: #2196F3; 
            color: white; 
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
        }
        #stopListenBtn { 
            background-color: #f44336; 
            color: white; 
            display: none; 
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }
        
        #status { 
            margin-top: 40px; 
            font-size: 22px; 
            font-weight: 500;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🎧 Live Audio Receiver</h1>
    <p>Press "Start Listening" to hear audio broadcasted from the microphone page.</p>

    <button id="listenBtn">👂 Start Listening</button>
    <button id="stopListenBtn">⏹️ Stop</button>

    <div id="status">Status: Connecting to server...</div>

    <div>
        <canvas id="visualizer" width="600" height="150" style="margin-top:20px; border-radius:10px; background-color:#1e1e1e; box-shadow:0 4px 15px rgba(0,0,0,0.5); max-width: 100%;"></canvas>
    </div>

    <script>
        const socket = io(); // Automatically finds and connects to the Flask SocketIO server
        let audioContext;
        let isListening = false;
        let nextTime = 0;

        const visualizerCanvas = document.getElementById('visualizer');
        const canvasCtx = visualizerCanvas.getContext('2d');
        let analyser;
        let visualizerFrame;

        // Initialize canvas
        canvasCtx.fillStyle = '#1e1e1e';
        canvasCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

        function drawVisualizer() {
            if (!analyser) return;
            visualizerFrame = requestAnimationFrame(drawVisualizer);
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = '#1e1e1e';
            canvasCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            canvasCtx.lineWidth = 3;
            canvasCtx.strokeStyle = '#00bcd4';
            canvasCtx.beginPath();

            const sliceWidth = visualizerCanvas.width * 1.0 / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * visualizerCanvas.height / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }

                x += sliceWidth;
            }

            canvasCtx.lineTo(visualizerCanvas.width, visualizerCanvas.height / 2);
            canvasCtx.stroke();
        }

        const listenBtn = document.getElementById('listenBtn');
        const stopListenBtn = document.getElementById('stopListenBtn');
        const statusEl = document.getElementById('status');

        socket.on('connect', () => {
             if(isListening) {
                 statusEl.innerText = "Status: Server Connected. Listening...";
                 statusEl.style.color = "#4CAF50";
             } else {
                 statusEl.innerText = "Status: Server Connected. Ready.";
                 statusEl.style.color = "#4CAF50";
             }
        });

        socket.on('disconnect', () => {
             statusEl.innerText = "Status: Server Disconnected. Retrying...";
             statusEl.style.color = "#f44336";
        });

        listenBtn.onclick = () => {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContextClass({ sampleRate: 44100 });
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.connect(audioContext.destination);

            isListening = true;
            nextTime = 0;
            listenBtn.style.display = 'none';
            stopListenBtn.style.display = 'inline-block';
            statusEl.innerText = "Status: 🎧 Listening to Broadcast...";
            statusEl.style.color = "#00bcd4"; // Cyan color for receiving

            drawVisualizer();
        };

        stopListenBtn.onclick = () => {
            isListening = false;

            if (visualizerFrame) { cancelAnimationFrame(visualizerFrame); visualizerFrame = null; }
            if (analyser) { analyser.disconnect(); analyser = null; }
            canvasCtx.fillStyle = '#1e1e1e';
            canvasCtx.fillRect(0, 0, visualizerCanvas.width, visualizerCanvas.height);

            if (audioContext) { audioContext.close(); audioContext = null; }
            
            listenBtn.style.display = 'inline-block';
            stopListenBtn.style.display = 'none';
            statusEl.innerText = "Status: Stopped.";
            statusEl.style.color = "#4CAF50";
        };

        socket.on('audio_broadcast', (audioData) => {
            if (!isListening || !audioContext) return;
            
            // audioData is an ArrayBuffer containing Int16 data sent from the Python server
            const int16Array = new Int16Array(audioData);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                // Convert back from 16-bit int to float range (-1.0 to 1.0)
                float32Array[i] = int16Array[i] / 0x8000;
            }
            
            const buffer = audioContext.createBuffer(1, float32Array.length, 44100);
            buffer.copyToChannel(float32Array, 0);

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(analyser);

            // Schedule sequential playback
            if (nextTime === 0 || nextTime < audioContext.currentTime) {
                nextTime = audioContext.currentTime + 0.05; // tiny buffer for stability
            }
            source.start(nextTime);
            nextTime += buffer.duration;
        });
    </script>
</body>
</html>
